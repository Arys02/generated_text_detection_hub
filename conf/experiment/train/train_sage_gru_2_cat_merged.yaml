# @package _global_
# conf/train/train_sage_gru_2_cat_merged.yaml
defaults:
  - override /hardware: single_gpu
  - override /training/split: predefined
  - override /training/model: sage_gru_2

seed: 0

dataset_train:
  with_pdf: False
  split: "calibration"
  subset_size: 10000

dataset_val:
  with_pdf: False
  split: "test"
  subset_size: 10000

hardware:
  device: "cuda:0"

training:
  model:
    seed: 0
    feature_spec: "v2_multi_merged"

    params_model:
      n_features: 7
      hidden: 32
      n_layers: 1

    params_training:
      epochs: 30
      lr: 1e-3

    batch_size: 64

name: "gru"