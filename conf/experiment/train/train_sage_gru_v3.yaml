# @package _global_

# file: conf/experiment/train/train_sage_gru_v3.yaml
defaults:
  - override /hardware: single_gpu
  - override /training/split: predefined
  - override /training/model: sage_gru_1

dataset_train:
  with_pdf: False
  split: "calibration"
  subset_size: 10000

dataset_val:
  with_pdf: False
  split: "test"
  subset_size: 10000

hardware:
  device: "cuda:0"

training:
  model:
    feature_spec: "v3_multi_novalid"        # encodage : 6 colonnes, sans valid

    feature_version:          # segmentation : inchangée, cache partagé avec v2
      segmentation: 2
      subj_category: ['Assertion', 'Expressive', 'Question', 'Suggestion']

    params_model:
      n_features: 6           # doit correspondre à SPECS['v3'].n_features
      hidden: 32
      n_layers: 1

    params_training:
      epochs: 30
      lr: 1e-3

    batch_size: 64
    seed: 0

name: "gru"